<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世帯登録｜新和町2丁目 町内会</title>
<script src="https://cdn.tailwindcss.com"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<main class="max-w-md mx-auto px-4 py-6">

  <header class="mb-5">
    <p class="text-sm font-bold text-emerald-700">新和町2丁目 町内会 公式LINE</p>
    <h1 class="text-2xl font-bold mt-1">世帯登録フォーム</h1>
    <p class="text-sm text-slate-600 mt-2">ご登録いただいた方に、<b>10/17（土）町内まつりの特別クーポン</b>をLINEでお送りします。</p>
  </header>

  <!-- 読み込み中 -->
  <section id="view-loading" class="bg-white rounded-2xl shadow p-6 text-center text-slate-500">
    読み込み中…
  </section>

  <!-- フォーム -->
  <form id="view-form" class="hidden bg-white rounded-2xl shadow p-5 space-y-5" novalidate>
    <p id="greeting" class="text-sm text-slate-600"></p>

    <div>
      <label for="kumi" class="block font-bold mb-1">組 <span class="text-red-600 text-xs">必須</span></label>
      <select id="kumi" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <option value="">選択してください</option>
      </select>
    </div>

    <div>
      <label for="setai" class="block font-bold mb-1">世帯名 <span class="text-red-600 text-xs">必須</span></label>
      <input id="setai" type="text" maxlength="50" placeholder="例：新和 太郎" autocomplete="name"
        class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>

    <div>
      <label for="banchi" class="block font-bold mb-1">番地 <span class="text-red-600 text-xs">必須</span></label>
      <input id="banchi" type="text" maxlength="50" placeholder="例：2-15-3"
        class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>

    <div class="rounded-xl bg-slate-50 border border-slate-200 p-3 text-sm text-slate-600 leading-relaxed">
      <p class="font-bold text-slate-700 mb-1">個人情報の取り扱い</p>
      ご入力いただいた情報とLINEのアカウント情報は、新和町2丁目町内会からのお知らせ、および町内まつりのクーポン配布にのみ使用します。情報は町内会役員の一部のみが管理し、第三者へ提供することはありません。
    </div>

    <label class="flex items-start gap-3">
      <input id="consent" type="checkbox" class="mt-1 h-5 w-5 accent-emerald-600">
      <span class="font-bold">上記に同意します <span class="text-red-600 text-xs">必須</span></span>
    </label>

    <p id="form-error" class="hidden text-sm text-red-600 font-bold"></p>

    <button id="submit" type="submit"
      class="w-full rounded-xl bg-emerald-600 py-4 text-lg font-bold text-white shadow active:bg-emerald-700 disabled:bg-slate-400">
      登録する
    </button>
  </form>

  <!-- 完了（トーク送信できなかった場合の案内） -->
  <section id="view-done" class="hidden bg-white rounded-2xl shadow p-6 text-center space-y-4">
    <p class="text-4xl">✅</p>
    <p class="text-lg font-bold">登録を受け付けました</p>
    <p class="text-sm text-slate-600">クーポンを受け取るには、公式LINEのトークで<br><b>「登録」</b>と送信してください。</p>
    <button id="open-chat" type="button"
      class="w-full rounded-xl bg-emerald-600 py-3 font-bold text-white shadow active:bg-emerald-700">
      トークを開いて送信する
    </button>
  </section>

  <!-- エラー -->
  <section id="view-error" class="hidden bg-white rounded-2xl shadow p-6 text-center space-y-2">
    <p class="text-lg font-bold text-red-600">読み込みに失敗しました</p>
    <p id="error-detail" class="text-sm text-slate-600"></p>
    <p class="text-sm text-slate-600">LINEアプリから開き直してください。</p>
  </section>

</main>

<script>
  // ===== 設定（環境に合わせて書き換える）=====
  const LIFF_ID = '2011760627-Brpl1Mbw';                  // LINE Developers の LIFF ID
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwxOJDBE1RHPFb7dr1g7XY0r9pzMW89uEGcq-JcLWnxioQVAmegueM9-PV6AZB_c9A3Gg/exec'; // GAS Webアプリの URL
  const OA_ID   = '@628eqtws';                                // 公式アカウントのベーシックID
  // ============================================

  const KUMI_LIST = ['1組', '2組', '3組', '4組', '5組', '6組', '7組', '8組', '9組', '10組', 'セルーラ'];
  const DONE_TEXT = '世帯情報を登録しました'; // main.gs と一致させる
  const MOCK = new URLSearchParams(location.search).get('mock') === '1';

  const $ = (id) => document.getElementById(id);
  const show = (id) => {
    ['view-loading', 'view-form', 'view-done', 'view-error'].forEach((v) => $(v).classList.toggle('hidden', v !== id));
  };

  KUMI_LIST.forEach((k) => $('kumi').insertAdjacentHTML('beforeend', `<option value="${k}">${k}</option>`));

  async function init() {
    if (MOCK) {
      $('greeting').textContent = 'テスト表示（モック）';
      show('view-form');
      return;
    }
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      const profile = await liff.getProfile();
      $('greeting').textContent = `${profile.displayName} さん、以下をご入力ください。`;
      show('view-form');
    } catch (err) {
      $('error-detail').textContent = String(err && err.message || err);
      show('view-error');
    }
  }

  function formError(msg) {
    $('form-error').textContent = msg;
    $('form-error').classList.toggle('hidden', !msg);
  }

  async function postRegister(payload) {
    if (MOCK) {
      await new Promise((r) => setTimeout(r, 600));
      return { ok: true, isNew: true };
    }
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライト回避
      body: JSON.stringify(payload),
    });
    return res.json();
  }

  // 本人のトークとして完了文言を送る（Webhook が無料の返信でクーポンを返す）
  async function notifyDone() {
    if (MOCK) return false;
    try {
      if (!liff.isInClient()) return false;
      await liff.sendMessages([{ type: 'text', text: DONE_TEXT }]);
      return true;
    } catch (err) {
      return false; // QRから開いた場合などトーク外ではここに来る
    }
  }

  $('view-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const kumi = $('kumi').value;
    const setai = $('setai').value.trim();
    const banchi = $('banchi').value.trim();
    const consent = $('consent').checked;

    if (!kumi) return formError('組を選択してください。');
    if (!setai) return formError('世帯名を入力してください。');
    if (!banchi) return formError('番地を入力してください。');
    if (!consent) return formError('個人情報の取り扱いに同意してください。');
    formError('');

    $('submit').disabled = true;
    $('submit').textContent = '送信中…';
    try {
      const idToken = MOCK ? 'mock' : liff.getIDToken();
      if (!idToken) {
        liff.login({ redirectUri: location.href });
        return;
      }
      const result = await postRegister({ action: 'register', idToken, kumi, setai, banchi, consent });
      if (!result.ok) {
        const msg = result.error === 'invalid_token'
          ? 'ログインの有効期限が切れました。フォームを開き直してください。'
          : '送信に失敗しました。入力内容をご確認のうえ、もう一度お試しください。';
        throw new Error(msg);
      }
      if (await notifyDone()) {
        liff.closeWindow();
        return;
      }
      show('view-done');
    } catch (err) {
      formError(err.message || '送信に失敗しました。通信環境をご確認ください。');
      $('submit').disabled = false;
      $('submit').textContent = '登録する';
    }
  });

  $('open-chat').addEventListener('click', () => {
    const url = `https://line.me/R/oaMessage/${encodeURIComponent(OA_ID)}/?${encodeURIComponent('登録')}`;
    if (!MOCK && liff.isInClient()) liff.openWindow({ url, external: false });
    else location.href = url;
  });

  init();
</script>
</body>
</html>
